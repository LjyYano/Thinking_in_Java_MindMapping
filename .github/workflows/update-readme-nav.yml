name: Update article index

on:
  push:
    branches: [master]
    paths:
      - "**/*.md"
      - ".github/workflows/update-readme-nav.yml"
      - "scripts/update_readme_nav.py"

permissions:
  contents: write

jobs:
  update-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate article index
        run: python scripts/update_readme_nav.py

      - name: Commit updated INDEX.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- INDEX.md; then
            git add INDEX.md
            git commit -m "chore: update article index"
            git push
          fi
