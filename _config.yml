title: "Yano's Notes"
tagline: "在代码、书影音与生活之间，持续构建自己的知识地图"
description: "Yano 的个人博客：Java、Redis、Spring、AI、读书、观影、游戏与生活随笔。"
author: "Yano"
lang: zh-CN
timezone: Asia/Shanghai

url: "https://ljyyano.github.io"
baseurl: "/Thinking_in_Java_MindMapping"
repository: "LjyYano/Thinking_in_Java_MindMapping"

markdown: kramdown
highlighter: rouge
strict_front_matter: true

kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false
  auto_ids: true

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

# Keep article titles stable: use explicit front matter titles when present,
# otherwise let the layouts fall back to the Markdown filename.
titles_from_headings:
  enabled: false

defaults:
  - scope:
      path: "AI"
    values:
      layout: article
      category: AI
  - scope:
      path: "编程"
    values:
      layout: article
      category: 编程
  - scope:
      path: "游戏"
    values:
      layout: article
      category: 游戏
  - scope:
      path: "观影"
    values:
      layout: article
      category: 观影
  - scope:
      path: "读书"
    values:
      layout: article
      category: 读书
  - scope:
      path: "随笔"
    values:
      layout: article
      category: 随笔

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - scripts
  - vendor
  - node_modules
  - .claude
  - .cursor
  - .cursorrules
  - .DS_Store
