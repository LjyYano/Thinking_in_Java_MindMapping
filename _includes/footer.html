<footer class="site-footer">
  <div class="footer-inner">
    <div>
      <a class="footer-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <p>{{ site.tagline }}</p>
    </div>
    <div class="footer-links">
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      <a href="{{ '/archive/' | relative_url }}">全部文章</a>
      <a href="https://github.com/{{ site.repository }}" target="_blank" rel="noopener">源码</a>
    </div>
    <p class="copyright">© {{ 'now' | date: '%Y' }} Yano · Built with Jekyll &amp; GitHub Pages</p>
  </div>
</footer>
