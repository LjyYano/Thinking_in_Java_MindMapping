<header class="site-header" data-header>
  <div class="header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} 首页">
      <span class="brand-mark" aria-hidden="true">Y</span>
      <span class="brand-copy">
        <strong>{{ site.title }}</strong>
        <small>THINK · LEARN · WRITE</small>
      </span>
    </a>

    <nav class="main-nav" id="main-nav" aria-label="主导航" data-nav>
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>首页</a>
      <a href="{{ '/archive/' | relative_url }}"{% if page.url == '/archive/' %} aria-current="page"{% endif %}>归档</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>关于</a>
      <a href="https://github.com/{{ site.repository }}" target="_blank" rel="noopener">GitHub</a>
    </nav>

    <div class="header-actions">
      <button class="icon-button search-trigger" type="button" aria-label="搜索文章" data-search-open>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.75"></circle><path d="m16 16 4.25 4.25"></path></svg>
        <span class="shortcut">/</span>
      </button>
      <button class="icon-button theme-toggle" type="button" aria-label="切换颜色主题" data-theme-toggle>
        <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path></svg>
        <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 15.2A8.6 8.6 0 0 1 8.8 3.6 8.6 8.6 0 1 0 20.4 15.2Z"></path></svg>
      </button>
      <button class="icon-button nav-toggle" type="button" aria-label="打开导航" aria-controls="main-nav" aria-expanded="false" data-nav-toggle>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      </button>
    </div>
  </div>
</header>
